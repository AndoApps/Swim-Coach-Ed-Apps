  :root{
    --bg-deep:#071019;
    --bg-panel:#0d1c28;
    --bg-panel-2:#112532;
    --bg-tile:#0b1922;
    --cyan:#2dd4e0;
    --cyan-dim:#1a7d86;
    --amber:#f5a623;
    --amber-dim:#7a5615;
    --red:#ff5a5a;
    --grey:#3a4d59;
    --green:#4ade80;
    --yellow:#ffe600;
    --pink:#ff6ec7;
    --pace-blue:#4da6ff;
    --text:#eef6f8;
    --muted:#5b7a8a;
    --line:#1c3644;
    --font-display:'Oswald', sans-serif;
    --font-body:'Work Sans', sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  button, .lane, .step-btn, select, input{ touch-action:manipulation; }
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% -10%, #0e2230 0%, var(--bg-deep) 60%);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* ---------- HEADER ---------- */
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:10px clamp(16px,2vw,32px) 0;
    flex-shrink:0;
  }
  .brand{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.12em;
    text-transform:uppercase; font-size:clamp(13px,1.3vw,18px); color:var(--cyan);
  }
  .brand span{ color:var(--muted); font-weight:400; margin-left:10px; }
  #clockOfDay{
    font-family:var(--font-display); letter-spacing:0.08em;
    font-size:clamp(13px,1.3vw,18px); color:var(--muted); font-variant-numeric:tabular-nums;
  }

  .header-right{ display:flex; align-items:baseline; gap:16px; }
  #awakeBadge{ font-family:var(--font-display); letter-spacing:0.06em; font-size:clamp(10px,1vw,13px); text-transform:uppercase; white-space:nowrap; }
  #awakeBadge.on{ color:#3ddc84; opacity:0.8; }
  #awakeBadge.off{ color:var(--amber); }
  .mode-tabs{ display:flex; gap:6px; }
  .mode-tab{
    padding:6px 14px; font-size:11px; font-family:var(--font-display); font-weight:600;
    letter-spacing:0.08em; text-transform:uppercase; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--muted); cursor:pointer;
  }
  .mode-tab:hover{ border-color:var(--cyan); }
  .mode-tab.active{ background:var(--cyan); color:#00232a; border-color:var(--cyan); }

  /* ---------- PACE CLOCK MODE ---------- */
  #paceClockView{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .pace-controls{
    display:flex; align-items:center; gap:8px; padding:10px clamp(16px,2vw,32px) 0; flex-shrink:0;
  }
  .pace-controls-label{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    font-size:10px; color:var(--muted); margin-right:4px;
  }
  .pace-controls button{ padding:7px 16px; font-size:11px; }
  .pace-controls button.active{ background:var(--cyan); color:#00232a; border-color:var(--cyan); }
  #paceClockGrid{
    flex:1; min-height:0; display:grid; gap:clamp(10px,1.4vw,20px);
    padding:clamp(8px,1.2vw,16px) clamp(16px,2vw,32px) clamp(10px,1.5vw,20px);
  }
  .pace-tile{
    --tile-color: var(--green);
    background:var(--bg-tile); border:1px solid var(--line); border-left:8px solid var(--tile-color);
    border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .pace-label{
    font-family:var(--font-display); font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
    font-size:clamp(16px,2.2vw,30px); color:var(--tile-color); margin-bottom:6px;
  }
  .pace-time{
    font-family:var(--font-display); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(90px,15vw,240px); color:var(--tile-color); line-height:1;
  }

  /* ---------- DEFAULTS PANEL ---------- */
  .panel{
    display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    margin:10px clamp(16px,2vw,32px) 0; padding:14px 18px;
    flex-shrink:0;
  }
  .panel-title{
    font-family:var(--font-display); font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; font-size:15px; color:var(--cyan);
    width:100%; margin-bottom:4px;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cyan); font-weight:700; }
  .field select{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--font-display); font-size:17px; text-align:left;
    border-radius:7px; padding:8px 10px;
  }
  .field select:focus{ outline:none; border-color:var(--cyan); }
  .field input[type="number"]{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--font-display); font-size:17px; text-align:center;
    border-radius:7px; padding:7px 6px; width:74px;
  }
  .field input[type="number"]:focus{ outline:none; border-color:var(--cyan); }

  /* stepper control (+/- for sets, reps, distance, interval, rest) — the
     defaults-panel versions are enlarged; other steppers (lane edit forms,
     cycle assignment popup) keep their own smaller sizing further below. */
  .stepper{ display:flex; align-items:stretch; gap:0; }
  .stepper .stepper-display{
    background:var(--bg-panel-2); border:1px solid var(--line); border-left:none; border-right:none;
    color:var(--text); font-family:var(--font-display); font-size:12px; text-align:center;
    padding:4px 2px; width:40px;
  }
  .stepper .step-btn{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cyan);
    font-family:var(--font-display); font-weight:700; font-size:12px; width:20px;
    cursor:pointer; padding:0; line-height:1;
  }
  .stepper .step-minus{ border-radius:5px 0 0 5px; }
  .stepper .step-plus{ border-radius:0 5px 5px 0; }
  .stepper .step-btn:hover{ background:var(--cyan-dim); color:#fff; }
  .stepper .step-btn:active{ transform:scale(0.94); }
  .lane-edit .stepper .stepper-display{ font-size:13px; padding:5px 2px; width:auto; flex:1; }
  .lane-edit .stepper .step-btn{ width:22px; font-size:13px; }

  /* Ribbon is a single line: sizes scale with screen width so it still fits
     on an iPad (about 1024px wide) with the Assign Lanes button showing. */
  #defaultsPanel{ flex-wrap:nowrap; gap:clamp(5px,0.8vw,14px); padding:10px clamp(8px,1.2vw,18px); align-items:flex-end; }
  #defaultsPanel .panel-title{ display:none; }
  #defaultsPanel .field label{ font-size:clamp(9px,1vw,13px); white-space:nowrap; }
  #defaultsPanel .stepper .stepper-display{
    font-size:clamp(15px,1.8vw,20px); padding:8px 1px; width:clamp(34px,4vw,66px); font-weight:600;
  }
  #defaultsPanel .stepper .step-btn{
    width:clamp(25px,2.7vw,36px); font-size:19px;
  }
  #defaultsPanel .btn-sm, #defaultsPanel .btn-primary, #defaultsPanel .btn-release{
    font-size:clamp(10px,1.15vw,15px); padding:12px clamp(6px,1vw,18px); white-space:nowrap; letter-spacing:0.03em;
  }
  #defaultsPanel .btn-sm, #defaultsPanel .btn-primary, #defaultsPanel .btn-release, #defaultsPanel #assignLanesBtn{ min-height:44px; }
  #defaultsPanel .panel-actions{ gap:clamp(4px,0.6vw,8px); flex-shrink:0; }
  #defaultsPanel .field{ flex-shrink:0; }
  #defaultsPanel #assignLanesBtn{ padding:12px clamp(6px,0.9vw,16px); }

  button{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.05em;
    text-transform:uppercase; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text); cursor:pointer; transition:all .15s ease;
  }
  button:hover{ border-color:var(--cyan); }
  button:active{ transform:scale(0.96); }
  .btn-sm{ padding:6px 10px; font-size:10px; }
  .btn-primary{ background:var(--cyan); color:#00232a; border-color:var(--cyan); padding:7px 16px; font-size:11px; }
  .btn-primary:hover{ background:#4de3ee; }
  .btn-primary.is-running{ background:var(--amber); border-color:var(--amber); color:#2a1a00; }
  .btn-release{ background:var(--amber-dim); border-color:var(--amber); color:var(--text); padding:7px 12px; font-size:10px; }
  .btn-release:hover{ background:var(--amber); color:#2a1a00; }

  .panel-actions{ display:flex; gap:8px; margin-left:auto; }

  /* ---------- CYCLE ASSIGNMENT MODAL ---------- */
  .cycle-assign-overlay{
    position:fixed; inset:0; background:rgba(3,10,16,0.78); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .cycle-assign-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:20px 22px; width:min(720px, 94vw); max-height:88vh; overflow-y:auto;
  }
  .cycle-assign-title{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    font-size:14px; color:var(--cyan); margin-bottom:14px;
  }
  .cycle-assign-section{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:12px;
  }
  .cycle-assign-section-title{
    font-family:var(--font-display); font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    font-size:15px; color:var(--yellow); margin-bottom:10px;
  }
  .cycle-assign-row{ display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .cycle-assign-lanes-wrap{ flex:1; min-width:220px; }
  .cycle-assign-lanes-label{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    font-size:10px; color:var(--muted); margin-bottom:6px;
  }
  .cycle-assign-lanes{ display:flex; gap:6px; flex-wrap:wrap; }
  .lane-toggle-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-tile); color:var(--muted); font-family:var(--font-display);
    font-weight:700; font-size:14px; cursor:pointer; padding:0;
  }
  .lane-toggle-btn:hover{ border-color:var(--cyan); }
  .lane-toggle-btn.active{ background:var(--cyan); border-color:var(--cyan); color:#00232a; }
  .cycle-assign-actions{ display:flex; justify-content:flex-end; margin-top:6px; }

  /* ---------- LANE GRID ---------- */
  main{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:clamp(8px,1vw,14px);
    padding:clamp(8px,1.2vw,16px) clamp(16px,2vw,32px) clamp(10px,1.5vw,20px);
  }

  .empty-state{
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--font-display); font-weight:500; letter-spacing:0.03em;
    font-size:clamp(16px,2vw,26px); color:var(--muted);
    background:var(--bg-tile); border:1px dashed var(--line); border-radius:14px;
    padding:24px;
  }
  .empty-state b{ color:var(--cyan); }

  .lane{
    position:relative;
    background:var(--bg-tile);
    border:1px solid var(--line);
    border-left:5px solid var(--grey);
    border-radius:12px;
    padding:8px 14px;
    display:flex; flex-direction:column;
    min-height:0;
    overflow:hidden;
    transition:border-color .3s ease, background .3s ease;
  }
  .lane.countdown{ border-left-color:var(--cyan); }
  .lane.countdown.warn{ border-left-color:var(--red); }
  .lane.resting{ border-left-color:var(--amber); }
  .lane.manual-wait{ border-left-color:var(--amber); background:#17140a; cursor:pointer; animation:pulseAmber 1.4s ease-in-out infinite; }
  .lane.leadin{ border-left-color:var(--green); background:#0a1f14; animation:pulseGreen 0.8s ease-in-out infinite; }
  .lane.leadin-red{ border-left-color:var(--red); background:#210a0a; animation:pulseRed 0.8s ease-in-out infinite; }
  .lane.done{ border-left-color:var(--green); opacity:0.55; }
  .lane.idle{ border-left-color:var(--grey); }
  .lane.delayed{ border-left-color:var(--muted); }

  @keyframes pulseAmber{
    0%,100%{ background:#17140a; }
    50%{ background:#241d0c; }
  }
  @keyframes pulseGreen{
    0%,100%{ background:#0a1f14; }
    50%{ background:#0f2f1e; }
  }
  @keyframes pulseRed{
    0%,100%{ background:#210a0a; }
    50%{ background:#331010; }
  }

  .lane-top{ display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .lane-num{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; row-gap:0; }
  .lane-word{
    font-family:var(--font-display); font-weight:500; letter-spacing:0.1em; text-transform:uppercase;
    font-size:calc(var(--scale,1) * clamp(9px,0.85vw,12px)); color:var(--muted);
  }
  .lane-digit{
    font-family:var(--font-display); font-weight:700; font-size:calc(var(--scale,1) * clamp(34px,4vw,58px));
    color:var(--yellow); line-height:1; letter-spacing:0.01em;
    text-shadow:0 0 18px rgba(255,230,0,0.25);
  }
  .edit-btn{
    background:none; border:none; color:var(--muted); font-size:18px; padding:2px 6px;
    cursor:pointer; line-height:1;
  }
  .edit-btn:hover{ color:var(--cyan); }
  .lane-actions{ display:flex; align-items:center; gap:2px; }
  .toggle-btn{
    background:none; border:none; color:var(--muted); font-size:17px; padding:2px 6px;
    cursor:pointer; line-height:1;
  }
  .toggle-btn:hover{ color:var(--amber); }

  .lane.inactive{
    border-left-color:var(--grey);
    opacity:0.4;
    cursor:pointer;
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .lane.inactive:hover{ opacity:0.6; }
  .lane.inactive .lane-top{ position:absolute; top:8px; left:14px; right:14px; }
  .lane.inactive .lane-body{ text-align:center; }

  .lane-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; }

  .lane-phase{
    font-family:var(--font-display); font-weight:700; letter-spacing:0.16em; text-transform:uppercase;
    font-size:calc(var(--scale-sub,1) * clamp(15px,1.7vw,24px)); color:var(--cyan); margin-bottom:2px;
  }
  .lane.resting .lane-phase, .lane.manual-wait .lane-phase{ color:var(--amber); }
  .lane.leadin .lane-phase{ color:var(--green); }
  .lane.leadin-red .lane-phase{ color:var(--red); }
  .lane.idle .lane-phase{ color:var(--muted); }
  .lane.delayed .lane-phase{ color:var(--muted); }
  .lane.done .lane-phase{ color:var(--green); }

  .lane-time{
    font-family:var(--font-display); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:calc(var(--scale,1) * clamp(62px,7.6vw,124px)); line-height:1;
  }
  .lane.leadin .lane-time{ color:var(--green); font-size:calc(var(--scale,1) * clamp(68px,8.2vw,132px)); }
  .lane.leadin-red .lane-time{ color:var(--red); font-size:calc(var(--scale,1) * clamp(68px,8.2vw,132px)); }
  .lane.countdown.warn .lane-time{ color:var(--red); }

  /* The 4,3,2,1,Go send-off override takes over the main clock digits */
  .lane-time.override{ color:var(--amber); }
  .lane-time.override.go{ color:var(--green); animation:pulseGroupGo 0.5s ease-in-out infinite; }
  @keyframes pulseGroupGo{ 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }

  .lane-progress{
    font-family:var(--font-display); font-weight:700; font-size:calc(var(--scale-sub,1) * clamp(16px,1.8vw,24px)); color:var(--text);
    margin-top:4px; letter-spacing:0.04em;
  }

  .lane-info{
    flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:calc(var(--scale-sub,1) * clamp(18px,2.1vw,28px)); color:var(--muted); margin-top:2px;
    font-family:var(--font-display); letter-spacing:0.03em;
  }
  .lane-info b{ color:var(--text); font-weight:500; }

  .manual-msg{
    font-family:var(--font-display); font-weight:600; text-transform:uppercase;
    letter-spacing:0.06em; font-size:calc(var(--scale,1) * clamp(12px,1.05vw,15px)); color:var(--amber); text-align:center;
  }

  /* ---------- CYCLE EDIT: member lane list ---------- */
  .cycle-lanes-label{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    font-size:10px; color:var(--muted); margin-top:4px;
  }
  .cycle-lanes-list{
    display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; overflow-y:auto; padding-right:2px;
  }
  .cycle-lane-row{ display:flex; align-items:center; gap:4px; }
  .cycle-lane-row .cycle-lane-name{
    font-family:var(--font-display); font-size:11px; color:var(--text); width:44px; flex-shrink:0;
  }
  .cycle-lane-row .stepper{ flex:1; }
  .cycle-lane-row .stepper .stepper-display{ font-size:11px; padding:4px 2px; }
  .cycle-lane-row .stepper .step-btn{ width:18px; font-size:11px; }

  /* "All lanes" row — a bulk-apply control that sits above the individual
     per-lane rows and pushes its value into every one of them on change.
     Styled distinctly (cyan tint) so it reads as the master control. */
  .cycle-lane-row-all{
    background:rgba(45,212,224,0.1); border:1px solid var(--cyan-dim);
    border-radius:6px; padding:4px 6px; margin-bottom:6px;
  }
  .cycle-lane-row-all .cycle-lane-name{ color:var(--cyan); font-weight:700; }
  .cycle-lane-row-all .stepper .stepper-display{ color:var(--cyan); font-weight:700; }

  /* ---------- LANE EDIT FORM ---------- */
  .lane-edit{
    flex:1; display:flex; flex-direction:column; gap:6px; justify-content:center; min-height:0;
    overflow-y:auto;
  }
  .lane-edit .row{ display:flex; gap:6px; }
  .lane-edit .field{ flex:1; }
  .lane-edit .field select{ width:100%; font-size:13px; padding:5px; }
  .lane-edit .field input[type="number"]{ width:100%; font-size:13px; padding:5px; }
  .lane-edit .actions{ display:flex; gap:6px; margin-top:2px; }
  .lane-edit .actions button{ flex:1; padding:7px; font-size:11px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="brand">Pool Deck <span>Lane Board</span></div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="modeLaneBtn">Lane Board</button>
    <button class="mode-tab" id="modePaceBtn">Pace Clock</button>
  </div>
  <div class="header-right"><span id="awakeBadge" class="off"></span><div id="clockOfDay">--:--:--</div></div>
</header>

<div id="laneBoardView" style="display:flex; flex-direction:column; flex:1; min-height:0;">

<div class="panel" id="defaultsPanel">
  <div class="panel-title" id="panelTitle">Default set — applies to every lane</div>
  <div class="field">
    <label>Sets</label>
    <div class="stepper" data-step="1" data-min="1">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dSets" class="stepper-display" value="3" readonly data-value="3">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field">
    <label>Reps</label>
    <div class="stepper" data-step="1" data-min="1">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dReps" class="stepper-display" value="4" readonly data-value="4">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field">
    <label>Dist (m)</label>
    <div class="stepper" data-step="25" data-min="25">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dDistance" class="stepper-display" value="100" readonly data-value="100">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field">
    <label>Interval</label>
    <div class="stepper" data-step="5" data-min="5">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dInterval" class="stepper-display" value="1:10" readonly data-value="70">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <!-- Groups / Stagger / Between sets / Rest live off the ribbon now (they keep
       their defaults and are changed per lane or per cycle). The controls stay
       in the page, hidden, so the rest of the code can still read them. -->
  <div id="ribbonHidden" style="display:none;">
  <div class="field">
    <label>Groups</label>
    <div class="stepper" data-step="1" data-min="1">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dGroups" class="stepper-display" value="1" readonly data-value="1">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field">
    <label>Stagger (s)</label>
    <div class="stepper" data-step="5" data-min="5">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dStagger" class="stepper-display" value="5" readonly data-value="5">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field">
    <label>Between sets</label>
    <select id="dBetween">
      <option value="straight">Straight in</option>
      <option value="rest">Rest</option>
      <option value="manual" selected>Manual (tap)</option>
    </select>
  </div>
  <div class="field" id="dRestWrap" style="display:none;">
    <label>Rest (sec)</label>
    <div class="stepper" data-step="5" data-min="0">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dRestSec" class="stepper-display" value="20" readonly data-value="20">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  </div><!-- /ribbonHidden -->

  <div class="field">
    <label>Cycles</label>
    <div class="stepper" data-step="1" data-min="0" data-max="11">
      <button type="button" class="step-btn step-minus">−</button>
      <input type="text" id="dCycleCount" class="stepper-display" value="0" readonly data-value="0">
      <button type="button" class="step-btn step-plus">+</button>
    </div>
  </div>
  <div class="field" id="assignLanesWrap" style="display:none;">
    <label>&nbsp;</label>
    <button type="button" class="btn-sm" id="assignLanesBtn">Assign Lanes</button>
  </div>
  <div class="panel-actions">
    <button class="btn-sm" id="applyAll">Apply All</button>
    <button class="btn-release" id="releaseAll">Start Next</button>
    <button class="btn-primary" id="startBtn">Start</button>
    <button class="btn-sm" id="resetBtn">Reset</button>
  </div>
</div>

<main id="laneGrid"></main>

<div class="cycle-assign-overlay" id="cycleAssignOverlay" style="display:none;">
  <div class="cycle-assign-card">
    <div class="cycle-assign-title">Set up your cycles</div>
    <div id="cycleAssignSections"></div>
    <div class="cycle-assign-actions">
      <button class="btn-primary" id="cycleAssignDone">Done</button>
    </div>
  </div>
</div>

</div>

<div id="paceClockView" style="display:none;">
  <div class="pace-controls">
    <span class="pace-controls-label">Colours</span>
    <button type="button" class="pace-mode-btn active" data-count="2">2 — 30s apart</button>
    <button type="button" class="pace-mode-btn" data-count="4">4 — 15s apart</button>
  </div>
  <div id="paceClockGrid"></div>
</div>


<script>
/* ---------------- Wall clock ---------------- */
function tickClock(){
  document.getElementById('clockOfDay').textContent = new Date().toLocaleTimeString([], {hour12:false});
}
tickClock();

/* ---------------- Mode switching (Lane Board / Pace Clock) ---------------- */
const laneBoardView = document.getElementById('laneBoardView');
const paceClockView = document.getElementById('paceClockView');
const modeLaneBtn = document.getElementById('modeLaneBtn');
const modePaceBtn = document.getElementById('modePaceBtn');

function switchMode(mode){
  const showLane = mode === 'lane';
  laneBoardView.style.display = showLane ? 'flex' : 'none';
  paceClockView.style.display = showLane ? 'none' : 'flex';
  modeLaneBtn.classList.toggle('active', showLane);
  modePaceBtn.classList.toggle('active', !showLane);
}
modeLaneBtn.addEventListener('click', ()=> switchMode('lane'));
modePaceBtn.addEventListener('click', ()=> switchMode('pace'));

/* ---------------- Pace clock ---------------- */
// A real synced pace clock: no start/stop, it always reads the current
// real-world second, just like a physical pool pace clock. Each colour is a
// "hand" offset from the real second by a fixed amount.
let paceClockCount = 2;
const PACE_COLORS_2 = [
  { name:'green', varName:'--green', offset:0 },
  { name:'gold',  varName:'--amber', offset:30 }
];
const PACE_COLORS_4 = [
  { name:'green', varName:'--green',     offset:0 },
  { name:'pink',  varName:'--pink',      offset:15 },
  { name:'gold',  varName:'--amber',     offset:30 },
  { name:'blue',  varName:'--pace-blue', offset:45 }
];
function paceColors(){ return paceClockCount === 4 ? PACE_COLORS_4 : PACE_COLORS_2; }

const paceClockGrid = document.getElementById('paceClockGrid');

function renderPaceClockGrid(){
  const colors = paceColors();
  paceClockGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
  paceClockGrid.style.gridTemplateRows = colors.length > 2 ? 'repeat(2, 1fr)' : 'repeat(1, 1fr)';
  paceClockGrid.innerHTML = colors.map(c => `
    <div class="pace-tile" style="--tile-color:var(${c.varName});" data-offset="${c.offset}">
      <div class="pace-label">${c.name}</div>
      <div class="pace-time">00</div>
    </div>
  `).join('');
}
renderPaceClockGrid();

document.querySelectorAll('.pace-mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    paceClockCount = parseInt(btn.dataset.count);
    document.querySelectorAll('.pace-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderPaceClockGrid();
  });
});

function tickPaceClock(){
  const secOfMinute = new Date().getSeconds();
  paceClockGrid.querySelectorAll('.pace-tile').forEach(tile=>{
    const offset = parseInt(tile.dataset.offset);
    const val = (secOfMinute + offset) % 60;
    tile.querySelector('.pace-time').textContent = val.toString().padStart(2,'0');
  });
}

setInterval(()=>{ tickClock(); tickPaceClock(); }, 1000);
tickPaceClock();

/* ---------------- Helpers ---------------- */
function formatInterval(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return m + ':' + s.toString().padStart(2,'0');
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

/* ---------------- Generic stepper wiring ---------------- */
// Works on any .stepper element: reads/writes data-value on the .stepper-display input.
// Interval/delay fields (id dInterval, or class f-interval/ca-interval/ca-delay) format as mm:ss, everything else is a plain integer.
function wireStepper(stepperEl){
  const step = parseInt(stepperEl.dataset.step) || 1;
  const min = parseInt(stepperEl.dataset.min) || 0;
  const max = stepperEl.dataset.max !== undefined ? parseInt(stepperEl.dataset.max) : Infinity;
  const display = stepperEl.querySelector('.stepper-display');
  const isInterval = display.classList.contains('f-interval') || display.id === 'dInterval'
    || display.classList.contains('ca-interval') || display.classList.contains('ca-delay');

  function refresh(){
    const v = parseInt(display.dataset.value) || min;
    display.value = isInterval ? formatInterval(v) : v;
  }
  refresh();

  stepperEl.querySelector('.step-plus').addEventListener('click', ()=>{
    const v = Math.min(max, (parseInt(display.dataset.value) || min) + step);
    display.dataset.value = v;
    refresh();
  });
  stepperEl.querySelector('.step-minus').addEventListener('click', ()=>{
    const v = Math.max(min, (parseInt(display.dataset.value) || min) - step);
    display.dataset.value = v;
    refresh();
  });
}
function getStepperValue(container, displaySelector){
  const el = container.querySelector(displaySelector);
  return parseInt(el.dataset.value) || 0;
}

/* ---------------- State ---------------- */
// The lane universe is fixed, not chosen: 11 lanes numbered 0-10, covering
// how pools are actually marked (0-9, 1-10, etc). Lane 10 is conventionally
// badged as "0" on deck (the leading 1 is dropped), so it displays that way
// everywhere even though it's tracked internally as lane 10 — see laneLabel().
const LANE_COUNT = 11;
const MAX_LANES = LANE_COUNT;
let globalRunning = false;
let globalIntervalId = null;
const LEADIN_SECONDS = 5;

// Real lane id (0-10) -> what's shown on screen. Lane 10 is shown as "0".
function laneLabel(id){
  return id === 10 ? '0' : String(id);
}

function defaultConfig(){
  return { sets:3, reps:4, distance:100, interval:70, betweenMode:'manual', restSec:20, groups:1, staggerSec:5, cycle:0 };
}

// Cycle 1-N shared timing settings — a brand-new cycle slot inherits whatever
// is currently in the top bar (Interval/Groups/Stagger/Between/Rest), then
// each cycle's interval and start delay are fine-tuned in the assignment
// screen and its groups/stagger/between/rest can be tweaked later on its
// own big tile. startDelay holds a cycle back at session start so a faster
// cycle can be timed to finish alongside a slower one.
let cycles = Array.from({length:MAX_LANES}, ()=>({ interval:70, groups:1, staggerSec:5, betweenMode:'manual', restSec:20, startDelay:0 }));
let cyclesInitialized = 0; // highest cycle index (1-based) that has ever been seeded
let cycleCount = 0;
let editingCycle = null;

// Which cycle a lane belongs to (0 = Individual) is stored on the lane itself
// and set via the assignment screen, not computed automatically — different
// sessions split lanes differently and shouldn't be forced into even ranges.
function cycleForLane(lane){
  return lane.config.cycle > cycleCount ? 0 : lane.config.cycle;
}

// Returns a lane's config with timing fields swapped for its cycle's shared
// settings when it belongs to one. Sets/reps/distance always stay the lane's own.
function effectiveConfig(lane){
  const ci = cycleForLane(lane);
  if(ci > 0){
    const cyc = cycles[ci - 1];
    return { ...lane.config, interval:cyc.interval, groups:cyc.groups, staggerSec:cyc.staggerSec, betweenMode:cyc.betweenMode, restSec:cyc.restSec, startDelay:cyc.startDelay||0 };
  }
  return { ...lane.config, startDelay:0 };
}

function makeLanes(count){
  return Array.from({length:count}, (_,i)=>({
    id: i,
    active: true,
    config: defaultConfig(),
    editing: false,
    runtime: { phase:'idle', remaining:0, currentSet:1, currentRep:1 }
  }));
}

let lanes = makeLanes(LANE_COUNT);

/* ---------------- Defaults panel behaviour ---------------- */
document.querySelectorAll('#defaultsPanel .stepper').forEach(wireStepper);

const dBetween = document.getElementById('dBetween');
const dRestWrap = document.getElementById('dRestWrap');
dBetween.addEventListener('change', ()=>{
  dRestWrap.style.display = dBetween.value === 'rest' ? 'flex' : 'none';
});

const panelTitle = document.getElementById('panelTitle');

/* ---------------- Cycles count ---------------- */
const dCycleStepper = document.getElementById('dCycleCount').closest('.stepper');
const assignLanesWrap = document.getElementById('assignLanesWrap');
function topBarTimingSnapshot(){
  return {
    interval: getStepperValue(document, '#dInterval'),
    groups: getStepperValue(document, '#dGroups'),
    staggerSec: getStepperValue(document, '#dStagger'),
    betweenMode: dBetween.value,
    restSec: getStepperValue(document, '#dRestSec')
  };
}

dCycleStepper.querySelectorAll('.step-btn').forEach(btn => btn.addEventListener('click', ()=>{
  cycleCount = getStepperValue(document, '#dCycleCount');
  // Any lane pointed at a cycle number that no longer exists drops back to Individual.
  lanes.forEach(l => { if(l.config.cycle > cycleCount) l.config.cycle = 0; });
  // Any cycle slot that's never existed before starts from whatever is
  // currently set in the top bar, so "3 groups" set there actually shows up.
  if(cycleCount > cyclesInitialized){
    const snapshot = topBarTimingSnapshot();
    for(let i = cyclesInitialized; i < cycleCount; i++){
      cycles[i] = { ...snapshot };
    }
    cyclesInitialized = cycleCount;
  }
  assignLanesWrap.style.display = cycleCount > 0 ? 'flex' : 'none';
  render();
}));
document.getElementById('assignLanesBtn').addEventListener('click', openCycleAssignModal);

/* ---------------- Cycle assignment screen: one section per cycle, each with
   its own timing fields AND a simple lane-number toggle grid, all in one place ---------------- */
const cycleAssignOverlay = document.getElementById('cycleAssignOverlay');
const cycleAssignSections = document.getElementById('cycleAssignSections');
let modalLaneCycle = {}; // laneId -> cycle, working copy while the modal is open

function cycleAssignSectionHtml(i){
  const cyc = cycles[i - 1];
  const laneButtons = lanes.map(l => `
    <button type="button" class="lane-toggle-btn${modalLaneCycle[l.id] === i ? ' active' : ''}" data-lane-id="${l.id}" data-cycle="${i}">${laneLabel(l.id)}</button>
  `).join('');
  return `
    <div class="cycle-assign-section" data-cycle="${i}">
      <div class="cycle-assign-section-title">Cycle ${i}</div>
      <div class="cycle-assign-row">
        <div class="field">
          <label>Interval</label>
          <div class="stepper" data-step="5" data-min="5">
            <button type="button" class="step-btn step-minus">−</button>
            <input type="text" class="ca-interval stepper-display" value="${formatInterval(cyc.interval)}" readonly data-value="${cyc.interval}">
            <button type="button" class="step-btn step-plus">+</button>
          </div>
        </div>
        <div class="field">
          <label>Start delay</label>
          <div class="stepper" data-step="5" data-min="0">
            <button type="button" class="step-btn step-minus">−</button>
            <input type="text" class="ca-delay stepper-display" value="${formatInterval(cyc.startDelay||0)}" readonly data-value="${cyc.startDelay||0}">
            <button type="button" class="step-btn step-plus">+</button>
          </div>
        </div>
        <div class="cycle-assign-lanes-wrap">
          <div class="cycle-assign-lanes-label">Lanes</div>
          <div class="cycle-assign-lanes">${laneButtons}</div>
        </div>
      </div>
    </div>
  `;
}

function openCycleAssignModal(){
  modalLaneCycle = {};
  lanes.forEach(l => { modalLaneCycle[l.id] = l.config.cycle; });
  cycleAssignSections.innerHTML = Array.from({length: cycleCount}, (_,i) => cycleAssignSectionHtml(i + 1)).join('');
  cycleAssignSections.querySelectorAll('.stepper').forEach(wireStepper);
  cycleAssignSections.querySelectorAll('.lane-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const laneId = parseInt(btn.dataset.laneId);
      const ci = parseInt(btn.dataset.cycle);
      modalLaneCycle[laneId] = (modalLaneCycle[laneId] === ci) ? 0 : ci;
      // Only flip the toggle states for this lane across sections — never
      // re-render the timing fields, or in-progress edits would be lost.
      cycleAssignSections.querySelectorAll(`.lane-toggle-btn[data-lane-id="${laneId}"]`).forEach(b=>{
        b.classList.toggle('active', modalLaneCycle[laneId] === parseInt(b.dataset.cycle));
      });
    });
  });
  cycleAssignOverlay.style.display = 'flex';
}

document.getElementById('cycleAssignDone').addEventListener('click', ()=>{
  cycleAssignSections.querySelectorAll('.cycle-assign-section').forEach(section=>{
    const ci = parseInt(section.dataset.cycle);
    // Groups/stagger/between-sets/rest aren't set here — they stay whatever
    // they already were (defaults, or previously tweaked on the big tile).
    cycles[ci - 1] = { ...cycles[ci - 1], interval: getStepperValue(section, '.ca-interval'), startDelay: getStepperValue(section, '.ca-delay') };
  });
  lanes.forEach(l => { l.config.cycle = modalLaneCycle[l.id] || 0; });
  cycleAssignOverlay.style.display = 'none';
  render();
});

document.getElementById('applyAll').addEventListener('click', ()=>{
  // Apply All only pushes what is visible on the ribbon: sets, reps, distance
  // and interval. Groups / stagger / between-sets / rest are no longer on the
  // ribbon, so they are left exactly as set on each lane or cycle.
  const cfg = {
    sets: getStepperValue(document, '#dSets'),
    reps: getStepperValue(document, '#dReps'),
    distance: getStepperValue(document, '#dDistance'),
    interval: getStepperValue(document, '#dInterval')
  };
  lanes.forEach(lane=>{
    lane.config = {...lane.config, ...cfg};
    lane.editing = false;
    lane.runtime = { phase:'idle', remaining:0, currentSet:1, currentRep:1 };
  });
  render();
});

/* ---------------- Timer engine ---------------- */
function beginLeadin(lane){
  lane.runtime.phase = 'leadin';
  lane.runtime.remaining = LEADIN_SECONDS;
}

function toggleActive(lane){
  lane.active = !lane.active;
  lane.editing = false;
  if(!lane.active){
    lane.runtime = { phase:'idle', remaining:0, currentSet:1, currentRep:1 };
  } else if(globalRunning){
    lane.runtime = { phase:'leadin', remaining:LEADIN_SECONDS, currentSet:1, currentRep:1 };
  } else {
    lane.runtime = { phase:'idle', remaining:0, currentSet:1, currentRep:1 };
  }
  render();
}

function startAll(){
  lanes.forEach(lane=>{
    if(lane.active && lane.runtime.phase === 'idle'){
      const delay = effectiveConfig(lane).startDelay || 0;
      if(delay > 0){
        lane.runtime = { phase:'delayed', remaining:delay, currentSet:1, currentRep:1 };
      } else {
        lane.runtime = { phase:'leadin', remaining:LEADIN_SECONDS, currentSet:1, currentRep:1 };
      }
    }
  });
  globalRunning = true;
  const btn = document.getElementById('startBtn');
  btn.textContent = 'Pause'; btn.classList.add('is-running');
  startRunner();
  render();
}
function pauseAll(){
  globalRunning = false;
  clearInterval(globalIntervalId);
  const btn = document.getElementById('startBtn');
  btn.textContent = 'Resume'; btn.classList.remove('is-running');
}
function resetAll(){
  globalRunning = false;
  clearInterval(globalIntervalId);
  const btn = document.getElementById('startBtn');
  btn.textContent = 'Start'; btn.classList.remove('is-running');
  lanes.forEach(lane=>{
    lane.runtime = { phase:'idle', remaining:0, currentSet:1, currentRep:1 };
  });
  render();
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(globalRunning){ pauseAll(); } else { startAll(); }
});
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('releaseAll').addEventListener('click', ()=>{
  lanes.forEach(lane=>{
    if(lane.active && lane.runtime.phase === 'manual-wait'){
      lane.runtime.currentSet += 1;
      lane.runtime.currentRep = 1;
      beginLeadin(lane);
    }
  });
  render();
});

// One second of progress for every running lane (no drawing).
function stepAll(){
  lanes.forEach(lane=>{
    if(!lane.active) return;
    const rt = lane.runtime;
    if(rt.phase === 'countdown' || rt.phase === 'resting' || rt.phase === 'leadin' || rt.phase === 'delayed'){
      rt.remaining -= 1;
      if(rt.remaining <= 0){ advanceLane(lane); }
    }
  });
}

// Timing runs off the real clock, not off counting timer ticks. Safari on
// iPad slows or pauses timers when the screen dims or the app is in the
// background; counting ticks would leave every lane behind. Instead we work
// out how many whole seconds have really passed since the last step and
// run that many steps, so the board catches up and stays accurate.
let lastStepAt = 0;
function runnerTick(){
  if(!globalRunning) return;
  const now = Date.now();
  let steps = Math.floor((now - lastStepAt) / 1000);
  if(steps < 1) return;
  steps = Math.min(steps, 7200);
  lastStepAt += steps * 1000;
  for(let i = 0; i < steps; i++) stepAll();
  render();
}
function startRunner(){
  clearInterval(globalIntervalId);
  lastStepAt = Date.now();
  globalIntervalId = setInterval(runnerTick, 200);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') runnerTick();
});

function advanceLane(lane){
  const cfg = effectiveConfig(lane), rt = lane.runtime;
  if(rt.phase === 'delayed'){
    // The delay countdown's own last 5 seconds already flashed green as the
    // go-in cue (see delayFlash) — go straight into swimming, no extra
    // lead-in tacked on afterwards.
    rt.phase = 'countdown';
    rt.remaining = cfg.interval;
    return;
  }
  if(rt.phase === 'leadin'){
    rt.phase = 'countdown';
    rt.remaining = cfg.interval;
    return;
  }
  if(rt.phase === 'countdown'){
    if(rt.currentRep < cfg.reps){
      rt.currentRep += 1;
      rt.remaining = cfg.interval;
    } else {
      // finished last rep of the set
      if(rt.currentSet < cfg.sets){
        if(cfg.betweenMode === 'straight'){
          rt.currentSet += 1; rt.currentRep = 1; rt.remaining = cfg.interval; rt.phase = 'countdown';
        } else if(cfg.betweenMode === 'rest'){
          rt.phase = 'resting'; rt.remaining = cfg.restSec;
        } else if(cfg.betweenMode === 'manual'){
          rt.phase = 'manual-wait'; rt.remaining = 0;
        }
      } else {
        rt.phase = 'done'; rt.remaining = 0;
      }
    }
  } else if(rt.phase === 'resting'){
    rt.currentSet += 1; rt.currentRep = 1; rt.remaining = cfg.interval; rt.phase = 'countdown';
  }
}

function manualAdvance(lane){
  if(lane.runtime.phase !== 'manual-wait') return;
  lane.runtime.currentSet += 1;
  lane.runtime.currentRep = 1;
  beginLeadin(lane);
  render();
}

/* ---------------- Lane edit ---------------- */
function openEdit(lane){
  lanes.forEach(l=>{ if(l !== lane) l.editing = false; });
  lane.editing = true;
  render();
}
function closeEdit(lane){ lane.editing = false; render(); }
function saveEdit(lane){
  const wrap = document.getElementById('edit-form-' + lane.id);
  const cfg = {
    sets: getStepperValue(wrap, '.f-sets'),
    reps: getStepperValue(wrap, '.f-reps'),
    distance: getStepperValue(wrap, '.f-distance'),
    interval: getStepperValue(wrap, '.f-interval'),
    betweenMode: wrap.querySelector('.f-between').value,
    restSec: getStepperValue(wrap, '.f-rest'),
    groups: getStepperValue(wrap, '.f-groups'),
    staggerSec: getStepperValue(wrap, '.f-stagger')
  };
  lane.config = {...cfg, cycle: lane.config.cycle};
  lane.editing = false;
  const prev = lane.runtime;
  if(prev && prev.phase === 'manual-wait'){
    // Stay paused — coach edited the config while the lane was waiting for a tap.
    // It should still wait for that tap, not jump straight into a countdown.
    const keepSet = Math.min(prev.currentSet, cfg.sets);
    const keepRep = Math.min(prev.currentRep, cfg.reps);
    lane.runtime = { phase:'manual-wait', remaining:0, currentSet:keepSet, currentRep:keepRep };
  } else if(globalRunning){
    const hasProgress = prev && prev.phase !== 'idle';
    const keepSet = hasProgress ? Math.min(prev.currentSet, cfg.sets) : 1;
    const keepRep = hasProgress ? Math.min(prev.currentRep, cfg.reps) : 1;
    lane.runtime = { phase:'leadin', remaining:LEADIN_SECONDS, currentSet:keepSet, currentRep:keepRep };
  } else {
    lane.runtime = { phase:'idle', remaining:0, currentSet:1, currentRep:1 };
  }
  render();
}

/* ---------------- Render ---------------- */
const laneGrid = document.getElementById('laneGrid');

function groupActiveLanesByCycle(){
  const groups = {};
  if(cycleCount <= 0) return groups;
  lanes.forEach(l=>{
    if(!l.active) return;
    const ci = cycleForLane(l);
    if(ci <= 0) return;
    (groups[ci] = groups[ci] || []).push(l);
  });
  return groups;
}

const SCALE_BY_COLS = { 1: 2.2, 2: 1.6, 3: 1.25, 4: 1, 5: 0.85, 6: 0.72 };
function scaleForCols(cols){ return SCALE_BY_COLS[cols] || 1; }
function layoutForCount(n){
  if(n <= 1) return { cols:1, rows:1 };
  if(n === 2) return { cols:2, rows:1 };
  if(n === 3) return { cols:3, rows:1 };
  if(n === 4) return { cols:2, rows:2 };
  if(n <= 6) return { cols:3, rows:2 };
  if(n <= 8) return { cols:4, rows:2 };
  if(n <= 10) return { cols:5, rows:2 };
  return { cols:6, rows:2 };
}

function render(){
  laneGrid.innerHTML = '';

  // Lanes assigned (via the assignment prompt) to the same cycle collapse
  // into one big tile. Once cycles are in use, a lane that wasn't selected
  // into any cycle simply doesn't appear on the board at all — Assign Lanes
  // is now the only thing that decides which lanes exist for a session, and
  // it offers the full 0-10 lane range regardless.
  // With no cycles set up, the board defaults to the common 8-lane pool
  // (lanes 1-8) rather than cluttering the screen with all 11 — lanes 0, 9
  // and 10 only come into play once cycles are used to reach for them.
  const cycleGroups = groupActiveLanesByCycle();

  const items = [];
  if(cycleCount > 0){
    Object.keys(cycleGroups).map(Number).sort((a,b)=>a-b).forEach(ci=>{
      items.push({ type:'cycle', cycleIndex: ci, members: cycleGroups[ci] });
    });
  } else {
    lanes.filter(lane => lane.id >= 1 && lane.id <= 8).forEach(lane=> items.push({ type:'lane', lane }));
  }

  if(items.length === 0 && cycleCount > 0){
    laneGrid.style.gridTemplateColumns = '1fr';
    laneGrid.style.gridTemplateRows = '1fr';
    laneGrid.innerHTML = '<div class="empty-state">No lanes assigned yet — tap <b>Assign Lanes</b> to put lanes on a cycle.</div>';
    return;
  }

  const { cols, rows } = layoutForCount(items.length);
  laneGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  laneGrid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  const scale = scaleForCols(cols);
  laneGrid.style.setProperty('--scale', scale);
  laneGrid.style.setProperty('--scale-sub', Math.min(scale, 1.3));

  items.forEach(item=>{
    const el = document.createElement('div');

    if(item.type === 'cycle'){
      const ci = item.cycleIndex, members = item.members;
      if(editingCycle === ci){
        el.className = 'lane editing';
        el.innerHTML = cycleEditHtml(ci, members);
        laneGrid.appendChild(el);
        wireCycleEditForm(ci, members, el);
        return;
      }
      const rep = pickRepresentative(members);
      const rrt = rep.runtime;
      const warn = rrt.phase === 'countdown' && rrt.remaining <= 3 && rrt.remaining > 0;
      const restFlash = rrt.phase === 'resting' && rrt.remaining <= 5;
      const delayFlash = rrt.phase === 'delayed' && rrt.remaining <= 5;
      // delayFlash swaps the phase class outright (rather than appending
      // 'leadin' alongside 'delayed') so the green lead-in styling always
      // wins, regardless of CSS rule order.
      el.className = 'lane ' + (delayFlash ? 'leadin' : rrt.phase) + (restFlash ? ' leadin-red' : '') + (warn ? ' warn' : '');
      el.innerHTML = cycleDisplayHtml(ci, members);
      laneGrid.appendChild(el);
      el.querySelector('.edit-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        lanes.forEach(l => l.editing = false);
        editingCycle = ci;
        render();
      });
      return;
    }

    const lane = item.lane;
    if(!lane.active){
      el.className = 'lane inactive';
      el.innerHTML = laneInactiveHtml(lane);
      el.addEventListener('click', ()=> toggleActive(lane));
      laneGrid.appendChild(el);
      return;
    }

    const rt = lane.runtime;
    const warn = rt.phase === 'countdown' && rt.remaining <= 3 && rt.remaining > 0;
    const restFlash = rt.phase === 'resting' && rt.remaining <= 5;
    const delayFlash = rt.phase === 'delayed' && rt.remaining <= 5;
    el.className = 'lane ' + (delayFlash ? 'leadin' : rt.phase) + (restFlash ? ' leadin-red' : '') + (warn ? ' warn' : '');

    if(lane.editing){
      el.innerHTML = laneEditHtml(lane);
      laneGrid.appendChild(el);
      wireEditForm(lane, el);
      return;
    }

    el.innerHTML = laneDisplayHtml(lane);
    laneGrid.appendChild(el);

    if(rt.phase === 'manual-wait'){
      el.querySelector('.lane-body').addEventListener('click', ()=> manualAdvance(lane));
    }
    el.querySelector('.edit-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      editingCycle = null;
      openEdit(lane);
    });
    el.querySelector('.toggle-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleActive(lane);
    });
  });
}

function laneInactiveHtml(lane){
  return `
    <div class="lane-top">
      <div class="lane-num"><span class="lane-word">LANE</span><span class="lane-digit">${laneLabel(lane.id)}</span></div>
    </div>
    <div class="lane-body">
      <div class="lane-phase" style="color:var(--muted);">INACTIVE</div>
      <div class="lane-progress">Tap to activate</div>
    </div>
  `;
}

function phaseLabelText(rt){
  switch(rt.phase){
    case 'idle': return 'READY';
    case 'delayed': return 'HOLD';
    case 'countdown': return 'SWIM';
    case 'resting': return 'REST';
    case 'manual-wait': return 'WAITING';
    case 'leadin': return 'GO IN';
    case 'done': return 'DONE';
  }
}

// Renders the phase label / big clock / progress line. Shared by individual
// lane tiles and consolidated cycle tiles so both look and behave the same.
function timerCenterHtml(rt, cfg, showProgress){
  const phase = phaseLabelText(rt);
  const restFlash = rt.phase === 'resting' && rt.remaining <= 5;
  // The last 5 seconds of a start delay double as the "go in" cue — no
  // separate lead-in tacked on afterwards, just this same countdown turning
  // green for its final stretch before swimming starts.
  const delayFlash = rt.phase === 'delayed' && rt.remaining <= 5;
  const wave = cfg.groups > 1;

  if(rt.phase === 'manual-wait'){
    return `<div class="manual-msg">Set ${rt.currentSet} done<br>Tap for Set ${rt.currentSet + 1}</div>`;
  }
  if(rt.phase === 'leadin'){
    return `
      <div class="lane-phase">${phase}</div>
      <div class="lane-time">${rt.remaining}</div>
    `;
  }
  if(restFlash){
    return `
      <div class="lane-phase">NEXT IN</div>
      <div class="lane-time">${rt.remaining}</div>
    `;
  }
  if(delayFlash){
    return `
      <div class="lane-phase">GO IN</div>
      <div class="lane-time">${rt.remaining}</div>
    `;
  }
  if(rt.phase === 'delayed'){
    return `
      <div class="lane-phase">${phase}</div>
      <div class="lane-time">${fmtTime(rt.remaining)}</div>
      <div class="lane-progress">Starts after delay</div>
    `;
  }
  if(rt.phase === 'idle'){
    return `
      <div class="lane-phase">${phase}</div>
      <div class="lane-time">${formatInterval(cfg.interval)}</div>
      ${cfg.startDelay ? `<div class="lane-progress">delay ${formatInterval(cfg.startDelay)}</div>` : ''}
    `;
  }
  if(rt.phase === 'done'){
    return `
      <div class="lane-phase">${phase}</div>
      ${showProgress ? `<div class="lane-progress">${cfg.sets} sets complete</div>` : ''}
    `;
  }

  // 'countdown' (swimming) or 'resting' before the last-5s flash.
  // For lanes with extra send-off groups, the last 4 seconds before each
  // extra group's turn override the real clock with 4,3,2,1,Go — otherwise
  // it's just the real remaining time, same as a single-swimmer lane.
  let timeText = fmtTime(rt.remaining);
  let timeClass = '';
  if(wave && rt.phase === 'countdown'){
    const elapsed = cfg.interval - rt.remaining;
    for(let gi = 1; gi < cfg.groups; gi++){
      const diff = gi * cfg.staggerSec - elapsed;
      if(diff >= 0){
        if(diff <= 4){
          timeText = diff === 0 ? 'GO' : String(diff);
          timeClass = diff === 0 ? ' override go' : ' override';
        }
        break;
      }
    }
  }
  return `
    <div class="lane-phase">${phase}</div>
    <div class="lane-time${timeClass}">${timeText}</div>
    ${showProgress ? `<div class="lane-progress">Set ${rt.currentSet}/${cfg.sets} · Rep ${rt.currentRep}/${cfg.reps}</div>` : ''}
  `;
}

// Picks which member lane's runtime drives a consolidated cycle tile: the
// least-progressed lane that isn't finished yet (so the shared clock keeps
// showing real countdowns as long as anyone in the cycle still needs it).
function pickRepresentative(members){
  let rep = null;
  members.forEach(l=>{
    if(!rep || (rep.runtime.phase === 'done' && l.runtime.phase !== 'done')){ rep = l; return; }
    if(l.runtime.phase === 'done') return;
    const score = (l.runtime.currentSet - 1) * 100000 + l.runtime.currentRep;
    const repScore = (rep.runtime.currentSet - 1) * 100000 + rep.runtime.currentRep;
    if(score < repScore) rep = l;
  });
  return rep || members[0];
}

function cycleDisplayHtml(cycleIndex, members){
  const cyc = cycles[cycleIndex - 1];
  const rep = pickRepresentative(members);
  const rt = rep.runtime;
  const cfg = { ...cyc, sets: rep.config.sets, reps: rep.config.reps, distance: rep.config.distance };

  const setsSame = members.every(l => l.config.sets === members[0].config.sets);
  const repsSame = members.every(l => l.config.reps === members[0].config.reps);
  const distSame = members.every(l => l.config.distance === members[0].config.distance);
  const showProgress = setsSame && repsSame;

  const centerHtml = timerCenterHtml(rt, cfg, showProgress);
  const laneList = members.map(l => l.id).sort((a,b)=>a-b).map(laneLabel).join(', ');
  const laneDigitSize = members.length <= 3 ? 'clamp(34px,4vw,58px)'
    : members.length <= 5 ? 'clamp(27px,3.3vw,45px)'
    : 'clamp(21px,2.6vw,36px)';

  return `
    <div class="lane-top">
      <div class="lane-num">
        <span class="lane-word">Lane${members.length === 1 ? '' : 's'}</span>
        <span class="lane-digit" style="font-size:calc(var(--scale,1) * ${laneDigitSize});">${laneList}</span>

  `;
}

  el.querySelector('.btn-save').addEventListener('click', ()=> saveCycleEdit(cycleIndex, el));

function saveCycleEdit(cycleIndex, el){
  cycles[cycleIndex - 1] = {
    ...cycles[cycleIndex - 1],
    interval: getStepperValue(el, '.cy-interval'),
    groups: getStepperValue(el, '.cy-groups'),
    staggerSec: getStepperValue(el, '.cy-stagger'),
    betweenMode: el.querySelector('.cy-between').value,
    restSec: getStepperValue(el, '.cy-rest')
  };
  el.querySelectorAll('.cycle-lanes-list .cycle-lane-row').forEach(row=>{
    const laneId = parseInt(row.dataset.laneId);
    const lane = lanes.find(l => l.id === laneId);
    if(!lane) return;
    lane.config.sets = getStepperValue(row, '.cl-sets');
    lane.config.reps = getStepperValue(row, '.cl-reps');
    lane.config.distance = getStepperValue(row, '.cl-distance');
    if(lane.runtime && lane.runtime.phase !== 'idle'){
      lane.runtime.currentSet = Math.min(lane.runtime.currentSet, lane.config.sets);
      lane.runtime.currentRep = Math.min(lane.runtime.currentRep, lane.config.reps);
    }
  });
  editingCycle = null;
  render();
}

function isAwake(){
  return !!wakeLock || (sleepVideo && !sleepVideo.paused && !sleepVideo.ended);
}
function updateAwakeBadge(){
  const b = document.getElementById('awakeBadge');
  if(!b) return;
  if(isAwake()){ b.textContent = '\u25CF Screen awake'; b.className = 'on'; }
  else { b.textContent = '\u25CB Tap screen to stay awake'; b.className = 'off'; }
}
async function requestWakeLock(){
  try {
    if('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible'){
      const lock = await navigator.wakeLock.request('screen');
      wakeLock = lock;
      lock.addEventListener('release', ()=>{ if(wakeLock === lock) wakeLock = null; updateAwakeBadge(); });
    }
  } catch(e){
    wakeLock = null; // not supported or refused — the video layer below still covers it
  }
  updateAwakeBadge();
}
function startSleepVideo(){
  try {
    if(!sleepVideo){
      const v = document.createElement('video');
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      v.setAttribute('muted', ''); v.muted = true; v.loop = true;
      v.setAttribute('aria-hidden', 'true'); v.tabIndex = -1;
      v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.02;pointer-events:none;z-index:-1;';
      [[NOSLEEP_MP4,'video/mp4'],[NOSLEEP_WEBM,'video/webm']].forEach(([src,type])=>{
        const s = document.createElement('source'); s.src = src; s.type = type; v.appendChild(s);

      v.addEventListener('pause', updateAwakeBadge);
      document.body.appendChild(v);
      sleepVideo = v;
    }
    if(sleepVideo.paused){
      const pr = sleepVideo.play();
      if(pr && pr.then) pr.then(updateAwakeBadge).catch(()=>updateAwakeBadge());
    }
  } catch(e){}
  updateAwakeBadge();
}
function keepAwake(){ requestWakeLock(); startSleepVideo(); }

requestWakeLock();
updateAwakeBadge();
// Any touch counts as the "user gesture" the browser needs for the video layer.
document.addEventListener('pointerdown', keepAwake, {passive:true});
document.addEventListener('touchend', keepAwake, {passive:true});
document.addEventListener('visibilitychange', ()=>{
  // Both layers are dropped when the app is hidden — re-arm when it comes back.
  if(document.visibilityState === 'visible'){ wakeLock = null; keepAwake(); }
});
// Safety net: if something has let go (battery saver, etc.), grab it again.
setInterval(()=>{ if(!isAwake() && document.visibilityState === 'visible') keepAwake(); }, 15000);

/* ---------------- Keyboard: space to start/pause, R to reset ---------------- */
document.addEventListener('keydown', (e)=>{
  const anyEditing = lanes.some(l=>l.editing);
  if(anyEditing) return;
  if(e.code === 'Space'){ e.preventDefault(); document.getElementById('startBtn').click(); }
  if(e.code === 'KeyR'){ document.getElementById('resetBtn').click(); }
});

/* ---------------- Offline support (home-screen install) ---------------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
